name: Nifty Options Strategy

on:
  workflow_dispatch:
  

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state from artifact
        id: restore-state
        uses: actions/download-artifact@v4
        with:
          name: strategy-state
          path: ${{ github.workspace }}
        continue-on-error: true     # first run has no artifact – silently skip

      - name: Run strategy
        env:
          FYERS_CLIENT_ID:    ${{ secrets.FYERS_CLIENT_ID }}
          FYERS_ACCESS_TOKEN: ${{ secrets.FYERS_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-state
          path: ${{ github.workspace }}/state.json
          retention-days: 1
          if-no-files-found: warn   # don't fail if state.json missing
        if: always()

      - name: Commit and push dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html state.json logs/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "dashboard update $(date -u '+%H:%M UTC')"
          git push
        if: always()
